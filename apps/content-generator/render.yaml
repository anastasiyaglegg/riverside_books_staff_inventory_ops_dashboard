services:
  - type: web
    name: riverside-marketing-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn riverside_marketing.api:app --app-dir src --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: RIVERSIDE_ALLOWED_ORIGINS
        sync: false
